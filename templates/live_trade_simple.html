{% extends "base.html" %}
{% block title %}Live Trading Platform{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <!-- Left Panel - Symbol Selection & Option Chain -->
    <div class="col-md-8">
      <!-- Symbol Selection Card with Toggle -->
      <div class="card shadow-sm mb-2" id="symbolCard">
        <div class="card-header bg-light d-flex justify-content-between align-items-center" style="padding: 4px 8px;">
          <small class="fw-semibold text-muted" style="font-size: 10px;">Symbol Selection</small>
          <button id="toggleSymbolCard" class="btn btn-sm p-0" style="background: none; border: none; font-size: 14px; color: #666;" title="Toggle Symbol Selection">
            <i class="fas fa-chevron-up" id="symbolToggleIcon"></i>
          </button>
        </div>
        <div class="card-body" id="symbolCardBody" style="padding: 8px;">
          <!-- Symbol Selection Row -->
          <div class="row g-2 align-items-center mb-2">
            <div class="col-md-4">
              <label class="form-label" style="font-size: 10px; margin-bottom: 2px;">Index:</label>
              <select class="form-select form-select-sm" style="font-size: 11px; height: 24px;">
                <option>NIFTY 50</option>
                <option>BANK NIFTY</option>
                <option>FINN NIFTY</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size: 10px; margin-bottom: 2px;">Exchange:</label>
              <select class="form-select form-select-sm" style="font-size: 11px; height: 24px;">
                <option>NSE</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size: 10px; margin-bottom: 2px;">Symbol:</label>
              <select class="form-select form-select-sm" style="font-size: 11px; height: 24px;">
                <option>Select Symbol</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Option Chain Card -->
      <div class="card shadow-sm" style="height: calc(100vh - 200px);">
        <div class="card-header bg-dark text-white">
          <h6 class="mb-0">Option Chain</h6>
        </div>
        <div class="card-body p-0" style="height: 100%; overflow-y: auto;">
          <table class="table table-sm mb-0">
            <thead class="table-dark sticky-top">
              <tr>
                <th>CE</th>
                <th>Strike</th>
                <th>PE</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>100.50</td>
                <td class="text-center fw-bold">23600</td>
                <td>45.25</td>
              </tr>
              <tr>
                <td>85.75</td>
                <td class="text-center fw-bold">23650</td>
                <td>60.80</td>
              </tr>
              <tr>
                <td>71.20</td>
                <td class="text-center fw-bold">23700</td>
                <td>78.50</td>
              </tr>
              <!-- More rows will be populated by JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right Panel - Charts & Analysis -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h6 class="mb-0">Analysis</h6>
        </div>
        <div class="card-body">
          <p>Charts and analysis will go here.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* Symbol Card Collapsible Styles */
#symbolCard.collapsed {
  height: 32px !important;
  overflow: hidden;
}

#symbolCard.collapsed #symbolCardBody {
  display: none !important;
}

#symbolCard {
  transition: all 0.3s ease;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggleSymbolCard');
    const symbolCard = document.getElementById('symbolCard');
    const toggleIcon = document.getElementById('symbolToggleIcon');
    
    if (toggleBtn && symbolCard && toggleIcon) {
        toggleBtn.addEventListener('click', function() {
            symbolCard.classList.toggle('collapsed');
            
            if (symbolCard.classList.contains('collapsed')) {
                toggleIcon.className = 'fas fa-chevron-down';
                console.log('✅ Symbol card collapsed - more space for option chain');
            } else {
                toggleIcon.className = 'fas fa-chevron-up';
                console.log('✅ Symbol card expanded');
            }
        });
        
        console.log('✅ Symbol card toggle functionality initialized');
    }
});
</script>

{% endblock %}
